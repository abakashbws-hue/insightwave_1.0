<h2 mat-dialog-title class="dialog-title">{{ title }}</h2>
<div mat-dialog-content class="dialog-content">
  <p class="warning-text">{{ message }}</p>
</div>
<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onCancel()" class="stay-btn">{{ cancelButtonText }}</button>
  <button mat-flat-button color="warn" (click)="onConfirm()" cdkFocusInitial class="confirm-button">
    {{ confirmButtonText }}
  </button>
</div>
