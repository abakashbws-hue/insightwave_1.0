<div class="confirm-delete-wrapper">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">{{ data.cancelButtonText }}</button>
    <button mat-button (click)="onConfirm()" cdkFocusInitial>
      {{ data.confirmButtonText }}
    </button>
  </mat-dialog-actions>
</div>
